<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nueva reserva' : 'Editar reserva' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>ID Usuario</mat-label>
      <input matInput formControlName="id_usuario" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>ID Material</mat-label>
      <input matInput formControlName="id_material" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Fecha de reserva</mat-label>
      <input matInput type="date" formControlName="fecha_reserva" />
    </mat-form-field>
    @if (data.mode === 'edit') {
      <mat-form-field appearance="outline" class="span-2">
        <mat-label>Estado</mat-label>
        <mat-select formControlName="estado_reserva">
          <mat-option value="pendiente">Pendiente</mat-option>
          <mat-option value="completada">Completada</mat-option>
          <mat-option value="cancelada">Cancelada</mat-option>
        </mat-select>
      </mat-form-field>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">Guardar</button>
</mat-dialog-actions>

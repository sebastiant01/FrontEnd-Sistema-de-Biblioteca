<div class="page-head">
  <h1>Sanciones</h1>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()">
    <mat-icon>add</mat-icon>
    Nuevo
  </button>
</div>

<div class="filtros-container mat-elevation-z1" [formGroup]="filtrosForm">
  <mat-form-field appearance="outline">
    <mat-label>ID Usuario</mat-label>
    <input matInput formControlName="id_usuario" placeholder="Filtrar por usuario...">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>ID Préstamo</mat-label>
    <input matInput formControlName="id_prestamo" placeholder="Filtrar por préstamo...">
  </mat-form-field>

  <div class="actions">
    <button mat-mini-fab color="primary" (click)="reload()" matTooltip="Buscar">
      <mat-icon>search</mat-icon>
    </button>
    <button mat-mini-fab color="warn" (click)="limpiarFiltros()" matTooltip="Limpiar filtros">
      <mat-icon>filter_alt_off</mat-icon>
    </button>
  </div>
</div>

@if (loading) {
  <div class="loading">
    <mat-spinner />
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="fecha_inicio">
        <th mat-header-cell *matHeaderCellDef>Fecha inicio</th>
        <td mat-cell *matCellDef="let r">{{ r.fecha_inicio | date:'shortDate' }}</td>
      </ng-container>

      <ng-container matColumnDef="dias_sancion">
        <th mat-header-cell *matHeaderCellDef>Días</th>
        <td mat-cell *matCellDef="let r">{{ r.dias_sancion }}</td>
      </ng-container>

      <ng-container matColumnDef="motivo">
        <th mat-header-cell *matHeaderCellDef>Motivo</th>
        <td mat-cell *matCellDef="let r">{{ r.motivo }}</td>
      </ng-container>

      <ng-container matColumnDef="fecha_creacion">
        <th mat-header-cell *matHeaderCellDef>Fecha creación</th>
        <td mat-cell *matCellDef="let r">{{ r.fecha_creacion | date:'short' }}</td>
      </ng-container>

      <ng-container matColumnDef="fecha_edicion">
        <th mat-header-cell *matHeaderCellDef>Fecha edición</th>
        <td mat-cell *matCellDef="let r">{{ r.fecha_edicion | date:'short' }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button type="button" (click)="editar(r)" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="eliminar(r)" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
  </div>
}

<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nuevo usuario' : 'Editar usuario' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Apellido</mat-label>
      <input matInput formControlName="apellido" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Documento</mat-label>
      <input matInput formControlName="documento" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Teléfono</mat-label>
      <input formControlName="telefono" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" formControlName="contrasena" />
      @if (data.mode === 'edit') {
        <mat-hint>Dejar vacío para no cambiar</mat-hint>
      }
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Rol</mat-label>
      <input matInput formControlName="rol" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">Guardar</button>
</mat-dialog-actions>

<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nueva revista' : 'Editar revista' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Código material (ej: R001)</mat-label>
      <input matInput formControlName="codigo_material" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Título</mat-label>
      <input matInput formControlName="titulo_material" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Volumen</mat-label>
      <input matInput type="number" formControlName="volumen" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Número de edición</mat-label>
      <input matInput type="number" formControlName="numero_edicion" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>ID Autor</mat-label>
      <input matInput formControlName="id_autor" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Descripción</mat-label>
      <input matInput formControlName="descripcion_material" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Fecha de publicación</mat-label>
      <input matInput type="date" formControlName="fecha_material" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">Guardar</button>
</mat-dialog-actions>
